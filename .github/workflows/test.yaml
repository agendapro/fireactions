---
name: test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.6'

    - name: Verify linux builds stay cgo-free
      run: |
        CGO_ENABLED=0 GOOS=linux go build ./...

    - name: Run tests
      run: |
        go test -v ./...
