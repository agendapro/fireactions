---
name: test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.6'

    - name: Verify linux builds stay cgo-free
      run: |
        CGO_ENABLED=0 GOOS=linux go build ./...

    - name: Verify the server package builds on non-linux (backend seam)
      run: |
        GOOS=darwin GOARCH=arm64 go build ./server/...
        ! GOOS=darwin go list -deps ./server | grep -E 'firecracker-microvm|containerd/'

    - name: Run tests
      run: |
        go test -v ./...
